<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07090f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NightShield" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>NightShield VPN</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon.svg" />
    <link rel="stylesheet" href="design-system/open-props-nightshield.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="status-panel" aria-label="VPN connection status">
        <header class="topbar">
          <button class="icon-button menu-button" aria-label="Open menu">
            <span class="menu-icon" aria-hidden="true"></span>
          </button>
          <div>
            <p class="eyebrow">NightShield</p>
            <h1>NightShield</h1>
          </div>
          <span class="status-chip" id="statusChip">Idle</span>
          <button class="icon-button" id="settingsButton" aria-label="Settings">
            <span class="sliders-icon" aria-hidden="true"></span>
          </button>
        </header>

        <div class="map-stage" aria-hidden="true">
          <span class="map-dot dot-one"></span>
          <span class="map-dot dot-two"></span>
          <span class="map-dot dot-three"></span>
          <span class="route-line"></span>
          <div class="connection-orb" id="connectionOrb">
            <div class="orb-ring"></div>
            <div class="orb-core"></div>
            <div class="shield-mark">NS</div>
          </div>
        </div>

        <div class="connection-copy">
          <p class="connection-state" id="connectionState">Disconnected</p>
          <p class="connection-detail" id="connectionDetail">Your traffic is not protected.</p>
        </div>

        <button class="connect-button" id="connectButton" type="button">
          <span id="connectIcon" aria-hidden="true"></span>
          <span id="connectText">Connect</span>
        </button>

        <div class="quick-strip" aria-label="Connection summary">
          <div>
            <span>Protocol</span>
            <strong>WireGuard</strong>
          </div>
          <div>
            <span>Mode</span>
            <strong>Private</strong>
          </div>
          <div>
            <span>Signal</span>
            <strong id="signalStat">0%</strong>
          </div>
        </div>
      </section>

      <section class="control-panel" aria-label="VPN controls">
        <nav class="tabbar" aria-label="VPN sections">
          <button class="tab active" type="button">Home</button>
          <button class="tab" type="button">Servers</button>
          <button class="tab" type="button">Activity</button>
        </nav>

        <div class="server-card">
          <span class="server-badge">Best</span>
          <div>
            <p class="label">Selected Location</p>
            <h2 id="serverName">Singapore</h2>
            <p class="muted" id="serverMeta">Fastest server &bull; 24 ms</p>
          </div>
          <select id="serverSelect" aria-label="Choose VPN server">
            <option value="Singapore|Fastest server|24">Singapore</option>
            <option value="Mumbai|Streaming optimized|31">Mumbai</option>
            <option value="Tokyo|Low latency|42">Tokyo</option>
            <option value="London|Private browsing|118">London</option>
            <option value="New York|Work mode|206">New York</option>
          </select>
        </div>

        <div class="location-rail" aria-label="Quick locations">
          <button class="location-card active" type="button" data-server="Singapore|Fastest server|24">
            <span>SG</span>
            <strong>Singapore</strong>
            <small>24 ms</small>
          </button>
          <button class="location-card" type="button" data-server="Mumbai|Streaming optimized|31">
            <span>IN</span>
            <strong>Mumbai</strong>
            <small>31 ms</small>
          </button>
          <button class="location-card" type="button" data-server="Tokyo|Low latency|42">
            <span>JP</span>
            <strong>Tokyo</strong>
            <small>42 ms</small>
          </button>
        </div>

        <div class="stats-grid">
          <article>
            <span class="label">Download</span>
            <strong id="downloadStat">0.0 Mbps</strong>
          </article>
          <article>
            <span class="label">Upload</span>
            <strong id="uploadStat">0.0 Mbps</strong>
          </article>
          <article>
            <span class="label">Protected</span>
            <strong id="timerStat">00:00</strong>
          </article>
          <article>
            <span class="label">IP Address</span>
            <strong id="ipStat">Hidden</strong>
          </article>
        </div>

        <div class="settings-list" id="settingsList">
          <label class="setting-row">
            <span>
              <strong>Kill Switch</strong>
              <small>Block internet if VPN drops</small>
            </span>
            <input type="checkbox" checked />
          </label>
          <label class="setting-row">
            <span>
              <strong>Auto Connect</strong>
              <small>Secure Wi-Fi automatically</small>
            </span>
            <input type="checkbox" />
          </label>
          <label class="setting-row">
            <span>
              <strong>Threat Shield</strong>
              <small>Filter risky domains</small>
            </span>
            <input type="checkbox" checked />
          </label>
        </div>

        <nav class="bottom-nav" aria-label="Primary navigation">
          <button class="active" type="button"><span class="home-icon"></span>Home</button>
          <button type="button"><span class="globe-icon"></span>Servers</button>
          <button type="button"><span class="lock-icon"></span>Secure</button>
        </nav>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
